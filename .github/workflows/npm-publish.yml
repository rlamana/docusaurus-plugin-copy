# This workflow will run tests using node and then publish a package to npm when a release is created.
# Publishing uses npm Trusted Publishing (OIDC) - no NPM_TOKEN secret required.
# Configure the trusted publisher on npmjs.com under your package's Settings > Publishing access,
# pointing it at this repo and this workflow filename (npm-publish.yml).
# For more information see: https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org/
    - run: npm install -g npm@latest
    - run: yarn install --frozen-lockfile
    - run: npm publish --provenance
